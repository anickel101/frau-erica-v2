AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Frau Erica gated-content API -- read-only Persons/Families/search behind
  Cognito auth, backed by a read-only SQLite snapshot synced from S3
  (s3://frau-erica-db-backups/current/frau_erica.db). See
  api/../CLAUDE.md-adjacent memory "gated-content-architecture" for the
  full design writeup: page-type-level gating (not per-record), Lambda
  downloads the snapshot to /tmp on cold start and caches it for warm
  invocations, canonical writable DB stays on the editor's own machine.

Parameters:
  CognitoUserPoolId:
    Type: String
    Description: >
      Cognito User Pool ID backing the pending/approved/admin groups.
      Leave the placeholder default here -- the real value is supplied as
      a deploy-time parameter (`sam deploy --guided`), not hardcoded.
    Default: REPLACE_WITH_USER_POOL_ID
  CognitoUserPoolClientId:
    Type: String
    Description: App client ID for the same user pool.
    Default: REPLACE_WITH_USER_POOL_CLIENT_ID
  FrontendOrigin:
    Type: String
    Description: >
      The single canonical origin, used to build the deep link in the
      Request Access admin-notification email. Must be one specific URL
      (a link can only point one place), which is why this stays separate
      from CorsAllowedOrigins below.
    Default: http://localhost:5173
  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Description: >
      Every origin a browser may call this API from. Deliberately a list,
      not the single FrontendOrigin above: production serves the site at
      both the apex (frauerica.org) and www, via two Route53 ALIAS records
      pointing at one CloudFront distribution, and an origin missing here
      fails every gated request with a CORS error rather than anything
      that looks like an auth problem. In production set this to
      "https://www.frauerica.org,https://frauerica.org".
    Default: http://localhost:5173

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256

Resources:
  FrauEricaApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # First real browser -> API Gateway call this project makes (the
      # login flow talks to Cognito directly, bypassing this entirely).
      CorsConfiguration:
        AllowOrigins: !Ref CorsAllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PATCH
          # DELETE is only used by /admin/users/{email}. Omitting it here
          # would fail the browser preflight, so deleting would break in
          # the UI while working perfectly from curl -- a confusing shape
          # of bug to chase.
          - DELETE
        AllowHeaders:
          - Authorization
          - Content-Type
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
              audience:
                - !Ref CognitoUserPoolClientId
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoAuthorizer
      # Throttling, added before going live on a public domain. The
      # default here is generous -- every other route sits behind the
      # Cognito authorizer, so abuse requires a real approved account.
      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40
      # POST /request-access is the exception that actually needs this:
      # it's the one route with Authorizer: NONE, and each call does an
      # SSM read + KMS decrypt, a Google siteverify round trip, a real
      # Cognito AdminCreateUser, and an SES send. reCAPTCHA v3 scores
      # rather than challenges, so it won't stop a scripted caller on its
      # own. Left unthrottled, a loop would fill the pool with junk
      # pending accounts and burn the SES sandbox's 200-message daily cap
      # -- after which genuine access requests silently stop arriving.
      # 1/sec sustained is far above real human use of a form submitted a
      # handful of times a year.
      RouteSettings:
        'POST /request-access':
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 5

  # Photo tags: who appears in which photograph.
  #
  # A table of its own, deliberately NOT the archive's ImageLinks. The
  # archive's writable copy lives on the archivist's machine and this API
  # only ever reads a snapshot of it; letting a web form write there
  # would mean inverting which copy is authoritative and retiring the
  # nightly backup -- a large piece of work that was considered and
  # deferred. Tagging needs none of it: tags are append-only and
  # low-stakes, so they are collected here and applied to ImageLinks
  # later in a reviewed batch.
  #
  # PAY_PER_REQUEST because the load is one person tagging photographs by
  # hand. Provisioned capacity would mean paying hourly for a table used
  # in bursts a few evenings a month.
  #
  # PointInTimeRecovery even though this is working data rather than the
  # archive: it represents hours of irreplaceable human judgment between
  # the moment it is entered and the moment it is applied, and the cost
  # is negligible at this size.
  PhotoTagsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-photo-tags'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # image_id + person_id as the composite key makes a tag unique for
      # free: tagging the same person twice overwrites rather than
      # duplicating, so there is no de-duplication to write and no tag id
      # to collide over.
      AttributeDefinitions:
        - AttributeName: image_id
          AttributeType: N
        - AttributeName: person_id
          AttributeType: N
        - AttributeName: gallery_id
          AttributeType: N
      KeySchema:
        - AttributeName: image_id
          KeyType: HASH
        - AttributeName: person_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # So the tagging page can fetch a whole gallery's tags in one
        # request when it opens, rather than one request per photograph.
        - IndexName: by-gallery
          KeySchema:
            - AttributeName: gallery_id
              KeyType: HASH
            - AttributeName: image_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Explicit log groups, one per function, purely to set a retention
  # policy. A Lambda creates its own log group on first invocation if one
  # doesn't exist, but that implicit group retains logs *forever* (the
  # AWS default), which SAM has no property to override -- confirmed with
  # `sam validate --lint`, which rejects LogRetentionInDays on both the
  # function and the Globals block.
  #
  # 30 days: long enough to diagnose an incident weeks after a report,
  # short enough to bound how long personal data sits around. Some of the
  # most useful lines here name a real family member (see src/lib/log.ts
  # on why), so an unbounded log is an unbounded record of who asked for
  # access to a private family archive and when.
  #
  # Names are declared rather than generated, so a group reads as
  # /aws/lambda/frau-erica-api-get-family instead of
  # /aws/lambda/frau-erica-api-GetFamilyFunction-eHaOFH8Vbp0u. Kept under
  # the /aws/lambda/ prefix deliberately: the basic execution role SAM
  # attaches grants CreateLogStream/PutLogEvents on that prefix only, so
  # a group named outside it would silently fail to receive anything.

  GetPersonLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-get-person'
      RetentionInDays: 30

  GetFamilyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-get-family'
      RetentionInDays: 30

  SearchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-search'
      RetentionInDays: 30

  AddPhotoTagLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-add-photo-tag'
      RetentionInDays: 30

  DeletePhotoTagLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-delete-photo-tag'
      RetentionInDays: 30

  ListPhotoTagsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-list-photo-tags'
      RetentionInDays: 30

  AnniversariesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-anniversaries'
      RetentionInDays: 30

  ListRecipesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-recipes'
      RetentionInDays: 30

  GetRecipeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-recipe'
      RetentionInDays: 30

  MeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-me'
      RetentionInDays: 30

  GermlineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-germline'
      RetentionInDays: 30

  RequestAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-request-access'
      RetentionInDays: 30

  AdminApproveUserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-admin-approve-user'
      RetentionInDays: 30

  AdminListUsersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-admin-list-users'
      RetentionInDays: 30

  AdminUpdateUserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-admin-update-user'
      RetentionInDays: 30

  AdminUpdateUserGroupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-admin-update-user-group'
      RetentionInDays: 30

  AdminDeleteUserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-admin-delete-user'
      RetentionInDays: 30

  GetPersonFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/persons.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/persons.handler
      LoggingConfig:
        LogGroup: !Ref GetPersonLogGroup
      # Bumped from the Globals default of 256 -- Lambda memory scales
      # CPU/network proportionally, and cold starts here spend most of
      # their time on the S3 snapshot download + sql.js WASM init, both
      # of which are CPU/network-bound. Measured via real CloudWatch
      # data: cold invocations were ~2.9-3.2s, warm ones ~3-200ms.
      MemorySize: 512
      Environment:
        Variables:
          DB_BUCKET: frau-erica-db-backups
          DB_KEY: current/frau_erica.db
      Policies:
        - Statement:
            - Sid: ReadCurrentSnapshotOnly
              Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::frau-erica-db-backups/current/frau_erica.db
      Events:
        GetPerson:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /persons/{id}
            Method: get

  GetFamilyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/families.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/families.handler
      LoggingConfig:
        LogGroup: !Ref GetFamilyLogGroup
      # See GetPersonFunction's MemorySize comment -- same reasoning.
      MemorySize: 512
      Environment:
        Variables:
          DB_BUCKET: frau-erica-db-backups
          DB_KEY: current/frau_erica.db
      Policies:
        - Statement:
            - Sid: ReadCurrentSnapshotOnly
              Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::frau-erica-db-backups/current/frau_erica.db
      Events:
        GetFamily:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /families/{id}
            Method: get

  SearchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/search.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/search.handler
      LoggingConfig:
        LogGroup: !Ref SearchLogGroup
      # See GetPersonFunction's MemorySize comment -- same reasoning.
      MemorySize: 512
      Environment:
        Variables:
          DB_BUCKET: frau-erica-db-backups
          DB_KEY: current/frau_erica.db
      Policies:
        - Statement:
            - Sid: ReadCurrentSnapshotOnly
              Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::frau-erica-db-backups/current/frau_erica.db
      Events:
        Search:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /search
            Method: get

  AnniversariesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/anniversaries.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/anniversaries.handler
      LoggingConfig:
        LogGroup: !Ref AnniversariesLogGroup
      # See GetPersonFunction's MemorySize comment -- same reasoning.
      MemorySize: 512
      Environment:
        Variables:
          DB_BUCKET: frau-erica-db-backups
          DB_KEY: current/frau_erica.db
      Policies:
        - Statement:
            - Sid: ReadCurrentSnapshotOnly
              Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::frau-erica-db-backups/current/frau_erica.db
      Events:
        Anniversaries:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /anniversaries
            Method: get

  # Keepers, the family cookbook. Gated to 'approved' like the family
  # tree -- the first gated content here that isn't Persons/Families
  # data. See schema.sql's Recipes comment for why it isn't exported to
  # static JSON like Documents and Galleries are.
  ListRecipesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/recipes.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/recipes.handler
      LoggingConfig:
        LogGroup: !Ref ListRecipesLogGroup
      # See GetPersonFunction's MemorySize comment -- same reasoning.
      MemorySize: 512
      Environment:
        Variables:
          DB_BUCKET: frau-erica-db-backups
          DB_KEY: current/frau_erica.db
      Policies:
        - Statement:
            - Sid: ReadCurrentSnapshotOnly
              Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::frau-erica-db-backups/current/frau_erica.db
      Events:
        ListRecipes:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /recipes
            Method: get

  GetRecipeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/recipe.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/recipe.handler
      LoggingConfig:
        LogGroup: !Ref GetRecipeLogGroup
      # See GetPersonFunction's MemorySize comment -- same reasoning.
      MemorySize: 512
      Environment:
        Variables:
          DB_BUCKET: frau-erica-db-backups
          DB_KEY: current/frau_erica.db
      Policies:
        - Statement:
            - Sid: ReadCurrentSnapshotOnly
              Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::frau-erica-db-backups/current/frau_erica.db
      Events:
        GetRecipe:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            # Slug, not id: it is the URL identity the frontend already
            # holds from the index, and it survives a reimport (which
            # reassigns recipe_id).
            Path: /recipes/{slug}
            Method: get

  MeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/me.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/me.handler
      LoggingConfig:
        LogGroup: !Ref MeLogGroup
      # No S3 policy -- this route only echoes back JWT claims already
      # validated by the Cognito authorizer, no database access at all.
      Events:
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /me
            Method: get

  GermlineFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/germline.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/germline.handler
      LoggingConfig:
        LogGroup: !Ref GermlineLogGroup
      # See GetPersonFunction's MemorySize comment -- same reasoning.
      MemorySize: 512
      Environment:
        Variables:
          DB_BUCKET: frau-erica-db-backups
          DB_KEY: current/frau_erica.db
      Policies:
        - Statement:
            - Sid: ReadCurrentSnapshotOnly
              Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::frau-erica-db-backups/current/frau_erica.db
      Events:
        Germline:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /me/germline
            Method: get

  RequestAccessFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/requestAccess.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/requestAccess.handler
      LoggingConfig:
        LogGroup: !Ref RequestAccessLogGroup
      Environment:
        Variables:
          RECAPTCHA_SECRET_PARAM: /frau-erica/recaptcha-secret-key
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      Policies:
        - Statement:
            - Sid: ReadRecaptchaSecret
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/frau-erica/recaptcha-secret-key
            # SecureString needs both permissions -- GetParameter alone
            # returns encrypted ciphertext without this.
            - Sid: DecryptRecaptchaSecret
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm
            # TWO resources, and a send needs both.
            #
            # The identity is the domain, not the archivist's gmail
            # address: SES authorises against the identity of the FROM
            # address, and lib/ses.ts sends from archivist@frauerica.org
            # (a deliverability fix -- gmail treats SES mail claiming to
            # be from gmail.com as spoofing). This was left naming the
            # old gmail identity when the sender moved, so every
            # access-request notification failed with AccessDenied from
            # 2026-09-08 to 2026-10-05: four weeks, three real
            # relatives, nobody told.
            #
            # The configuration set is the half that bit immediately
            # after. hosting/dns.yaml attaches frau-erica-default to the
            # identity as its DEFAULT configuration set, so it applies to
            # every send from this domain without appearing anywhere in
            # the send call -- and SES then authorises the config set as
            # a resource in its own right. Granting the identity alone
            # moved the AccessDenied from one ARN to the other.
            #
            # Three facts in three files that must agree: FROM_ADDRESS in
            # lib/ses.ts, the ConfigurationSet name in hosting/dns.yaml,
            # and these ARNs. ses.test.ts reads all three and fails if
            # they drift -- which is the only thing tying them together,
            # since nothing in the type system can.
            - Sid: SendAdminNotification
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/frauerica.org
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/frau-erica-default
            # Creates the requester's own account, in 'pending', with no
            # usable credentials yet (MessageAction: SUPPRESS in the
            # handler) -- see adminApproveUser.ts for the only place
            # real login credentials ever get issued.
            - Sid: CreatePendingAccount
              Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      Events:
        RequestAccess:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /request-access
            Method: post
            # No account exists yet for the requester -- this route must
            # not sit behind the pool-wide Cognito authorizer.
            Auth:
              Authorizer: NONE

  AdminApproveUserFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/adminApproveUser.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/adminApproveUser.handler
      LoggingConfig:
        LogGroup: !Ref AdminApproveUserLogGroup
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      # Most sensitive IAM grant in the project -- can create real login
      # credentials and grant real site access. All five actions are
      # still scoped to exactly this one user pool, nothing else.
      # AdminGetUser distinguishes a pending Request Access account
      # (already exists, just needs person_id + the invite resent) from
      # a bootstrap approval (create fresh); AdminUpdateUserAttributes
      # sets person_id on the pending path; AdminRemoveUserFromGroup
      # moves them out of pending once approved.
      Policies:
        - Statement:
            - Sid: CreateAndApproveAccounts
              Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      Events:
        AdminApproveUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /admin/approve
            Method: post

  AdminListUsersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/adminListUsers.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/adminListUsers.handler
      LoggingConfig:
        LogGroup: !Ref AdminListUsersLogGroup
      # Bumped from the Globals default of 256, same reasoning as
      # GetPersonFunction -- this is the first version of this function
      # that touches the DB snapshot (to resolve full names), so it now
      # pays the same S3-download + sql.js-init cold-start cost.
      MemorySize: 512
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          DB_BUCKET: frau-erica-db-backups
          DB_KEY: current/frau_erica.db
      Policies:
        - Statement:
            - Sid: ListExistingUsers
              Effect: Allow
              Action: cognito-idp:ListUsersInGroup
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
            - Sid: ReadCurrentSnapshotOnly
              Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::frau-erica-db-backups/current/frau_erica.db
      Events:
        AdminListUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /admin/users
            Method: get

  AdminUpdateUserFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/adminUpdateUser.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/adminUpdateUser.handler
      LoggingConfig:
        LogGroup: !Ref AdminUpdateUserLogGroup
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      Policies:
        - Statement:
            - Sid: UpdateUserPersonId
              Effect: Allow
              Action: cognito-idp:AdminUpdateUserAttributes
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      Events:
        AdminUpdateUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /admin/users
            Method: patch

  AdminUpdateUserGroupFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/adminUpdateUserGroup.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/adminUpdateUserGroup.handler
      LoggingConfig:
        LogGroup: !Ref AdminUpdateUserGroupLogGroup
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      # Separate function from AdminApproveUserFunction/AdminUpdateUserFunction
      # despite similar-sounding actions -- promoting/demoting admin
      # status is meaningfully more sensitive than either account
      # creation or a person_id correction, so it gets its own narrowly
      # scoped policy rather than accumulating permissions on an
      # existing function.
      Policies:
        - Statement:
            - Sid: ChangeAdminGroupMembership
              Effect: Allow
              Action:
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      Events:
        AdminUpdateUserGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /admin/users/{email}/group
            Method: patch

  AdminDeleteUserFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/adminDeleteUser.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/adminDeleteUser.handler
      LoggingConfig:
        LogGroup: !Ref AdminDeleteUserLogGroup
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      # The only irreversible action in the API, so it gets its own
      # function and its own two-action policy rather than borrowing one
      # that can already do other things. AdminListGroupsForUser is here
      # because the handler refuses to delete an admin without a prior
      # demotion, and it has to read the groups to know.
      Policies:
        - Statement:
            - Sid: DeleteNonAdminAccounts
              Effect: Allow
              Action:
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminListGroupsForUser
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      Events:
        AdminDeleteUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /admin/users/{email}
            Method: delete

  # --- Photo tagging (admin only) -------------------------------------
  #
  # All three write to, or read from, the PhotoTags table and nothing
  # else. AddPhotoTag additionally gets the same READ-ONLY snapshot grant
  # every gated route has, purely to validate that a tag points at a real
  # person and a photograph genuinely in that gallery. No function here
  # can write to the archive; there is no S3 PutObject permission in the
  # stack at all.

  AddPhotoTagFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/addPhotoTag.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/addPhotoTag.handler
      LoggingConfig:
        LogGroup: !Ref AddPhotoTagLogGroup
      # 512 like the other snapshot-reading functions -- this one pays
      # the S3 download + sql.js init cold start to validate ids.
      MemorySize: 512
      Environment:
        Variables:
          PHOTO_TAGS_TABLE: !Ref PhotoTagsTable
          DB_BUCKET: frau-erica-db-backups
          DB_KEY: current/frau_erica.db
      Policies:
        - Statement:
            - Sid: WriteOwnTagsTableOnly
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt PhotoTagsTable.Arn
            - Sid: ReadCurrentSnapshotOnly
              Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::frau-erica-db-backups/current/frau_erica.db
      Events:
        AddPhotoTag:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /photo-tags
            Method: post

  DeletePhotoTagFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/deletePhotoTag.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/deletePhotoTag.handler
      LoggingConfig:
        LogGroup: !Ref DeletePhotoTagLogGroup
      Environment:
        Variables:
          PHOTO_TAGS_TABLE: !Ref PhotoTagsTable
      Policies:
        - Statement:
            - Sid: DeleteOwnTagsTableOnly
              Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt PhotoTagsTable.Arn
      Events:
        DeletePhotoTag:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /photo-tags/{imageId}/{personId}
            Method: delete

  ListPhotoTagsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/listPhotoTags.ts
        Format: cjs
        Target: node22
        Sourcemap: false
    Properties:
      Handler: src/handlers/listPhotoTags.handler
      LoggingConfig:
        LogGroup: !Ref ListPhotoTagsLogGroup
      Environment:
        Variables:
          PHOTO_TAGS_TABLE: !Ref PhotoTagsTable
      Policies:
        - Statement:
            # Query for one gallery (via the by-gallery index, which
            # needs its own ARN -- the table ARN with /index/* appended),
            # and Scan for "everything collected so far", which the
            # gallery picker asks for to show progress. Scan is usually
            # the wrong instinct, but one request beats 31 for a table
            # this size.
            - Sid: ReadOwnTagsTableOnly
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt PhotoTagsTable.Arn
                - !Sub '${PhotoTagsTable.Arn}/index/*'
      Events:
        ListPhotoTags:
          Type: HttpApi
          Properties:
            ApiId: !Ref FrauEricaApi
            Path: /photo-tags
            Method: get

Outputs:
  ApiUrl:
    Description: Base URL for the deployed API
    Value: !Sub https://${FrauEricaApi}.execute-api.${AWS::Region}.amazonaws.com
